# Project-scoped Codex configuration for this repository.
# Codex loads this file only when the repository is trusted.

approval_policy = { granular = {
  sandbox_approval = true,
  rules = true,
  mcp_elicitations = true,
  request_permissions = true,
  skill_approval = false
} }

default_permissions = "repo_mac_setup"
allow_login_shell = false
web_search = "cached"
project_doc_max_bytes = 32768
project_root_markers = [".git"]

[agents]
max_threads = 4
max_depth = 1

[permissions.repo_mac_setup.filesystem]
":minimal" = "read"
glob_scan_max_depth = 3

[permissions.repo_mac_setup.filesystem.":workspace_roots"]
"." = "write"
".git" = "read"
"**/.env" = "deny"
"**/*.env" = "deny"
"**/*secret*" = "deny"
"**/*token*" = "deny"

[permissions.repo_mac_setup.network]
enabled = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
include_only = ["PATH", "HOME", "USER", "SHELL", "TMPDIR"]
